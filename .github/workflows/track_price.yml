name: Suivi prix vol Tunis-Malé

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le prix et alerter si besoin
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_tracker.py

      - name: Sauvegarder l'historique des prix
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@github.com"
          git add price_history.json airport_cache.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Mise à jour historique des prix"
          git push || true
